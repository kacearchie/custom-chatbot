<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Floating AI Widget</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f1f5f9;
      --chat-bg: #ffffff;
      --text-color: #1e293b;
      --bot-msg-bg: #f3f4f6;
      --user-msg-bg: #2563eb;
      --user-msg-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      /* Full page bg is optional now that it's a widget */
    }

    /* ----------------------------------------------- */
    /* 1. NEW: Widget Wrapper & Toggle Animation      */
    /* ----------------------------------------------- */
    
    .chat-widget-wrapper {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 15px;
    }

    /* Initial state of the chat window: Hidden, slightly scaled down */
    .chat-container {
      width: 380px;
      height: 600px;
      background: var(--chat-bg);
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      
      /* Toggle transition settings */
      opacity: 0;
      pointer-events: none; /* User can't click it when hidden */
      transform: scale(0.9) translateY(20px);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* Class added via JS to show the chat window */
    .chat-container.open {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
    }

    /* ----------------------------------------------- */
    /* existing UI styles (slight tweaks)             */
    /* ----------------------------------------------- */

    .chat-header {
      background: var(--primary-color);
      color: white;
      padding: 16px 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-info { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; }

    .clear-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .message.user { align-self: flex-end; background-color: var(--user-msg-bg); color: var(--user-msg-color); border-bottom-right-radius: 2px; }
    .message.bot { align-self: flex-start; background-color: var(--bot-msg-bg); color: var(--text-color); border-bottom-left-radius: 2px; }
    .message.error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    /* ----------------------------------------------- */
    /* 2. NEW: Typing Dots Animation Styles           */
    /* ----------------------------------------------- */
    
    .message.typing {
      align-self: flex-start;
      background-color: var(--bot-msg-bg);
      padding: 10px 16px;
      border-radius: 12px;
      border-bottom-left-radius: 2px;
      display: none; /* JS will set to flex/none */
      align-items: center;
      gap: 5px;
    }

    .message.typing.visible {
      display: flex; /* Show when 'visible' class is active */
    }

    .message.typing span {
      width: 8px;
      height: 8px;
      background-color: #94a3b8;
      border-radius: 50%;
      display: block;
      animation: typing 1.4s infinite ease-in-out both;
    }

    /* Offset animations for 'bouncing' effect */
    .message.typing span:nth-child(1) { animation-delay: -0.32s; }
    .message.typing span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ----------------------------------------------- */
    /* Input UI styles (slight tweaks)                */
    /* ----------------------------------------------- */

    .chat-input-container { padding: 16px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; background: #ffffff; }
    .chat-input { flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 24px; outline: none; font-size: 0.95rem; }
    .chat-input:focus { border-color: var(--primary-color); }
    .send-btn { background: var(--primary-color); color: white; border: none; padding: 12px 20px; border-radius: 24px; font-weight: 600; cursor: pointer; }
    .send-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

    /* ----------------------------------------------- */
    /* 3. NEW: Floating Bubble Button Styles          */
    /* ----------------------------------------------- */
    
    .chat-bubble-launcher {
      width: 60px;
      height: 60px;
      background-color: var(--primary-color);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: none;
      outline: none;
    }

    .chat-bubble-launcher:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }
  </style>
</head>
<body>

  <!-- Example Background Content -->
  <div style="padding: 50px; text-align: center; color: #64748b;">
    <h1>Main Website Content</h1>
    <p>The floating chatbot widget is in the bottom right.</p>
  </div>


  <!-- ============================================== -->
  <!-- 4. HTML structure for the new widget           -->
  <!-- ============================================== -->
  <div class="chat-widget-wrapper" id="chatWidgetWrapper">
    
    <!-- The Chat Window (Hidden by default) -->
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        <div class="header-info">
          <div class="status-dot"></div>
          <span>AI Assistant</span>
        </div>
        <button id="clearBtn" class="clear-btn">Reset</button>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="message bot">
          Hello! I'm ready. How can I help you today?
        </div>
        
        <!-- ============================================== -->
        <!-- 5. NEW: Static HTML for the typing animation  -->
        <!-- ============================================== -->
        <div class="message typing" id="typingIndicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <form class="chat-input-container" id="chatForm">
        <input 
          type="text" 
          id="userInput" 
          class="chat-input" 
          placeholder="Type a message..." 
          autocomplete="off"
          required
        >
        <button type="submit" id="sendBtn" class="send-btn">Send</button>
      </form>
    </div>

    <!-- 6. NEW: The Floating Bubble Launcher Button -->
    <button class="chat-bubble-launcher" id="bubbleLauncher">
      💬 <!-- You can use an icon font like FontAwesome here instead -->
    </button>
  </div>


  <script>
    // Live Render FastAPI Backend Endpoint
    const API_URL = "https://custom-chatbot-api-yky8.onrender.com/chat";

    // Core Chat Elements
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    
    // 7. NEW: Widget/Animation Elements
    const chatWidgetWrapper = document.getElementById("chatWidgetWrapper");
    const chatContainer = document.getElementById("chatContainer");
    const bubbleLauncher = document.getElementById("bubbleLauncher");
    const typingIndicator = document.getElementById("typingIndicator");

    // History & Context
    let conversationHistory = [];
    const MAX_HISTORY_MESSAGES = 10; 

    // --------------------------------------------------
    // 8. NEW: Toggle Widget Functionality
    // --------------------------------------------------
    
    function toggleChatWindow() {
      const isOpen = chatContainer.classList.contains("open");
      if (isOpen) {
        chatContainer.classList.remove("open");
        bubbleLauncher.textContent = "💬"; // Change icon back to chat bubble
      } else {
        chatContainer.classList.add("open");
        bubbleLauncher.textContent = "✕"; // Change icon to close 'X'
        userInput.focus(); // Focus input immediately
      }
    }

    bubbleLauncher.addEventListener("click", toggleChatWindow);

    // --------------------------------------------------

    function appendMessage(text, sender, isError = false) {
      const messageDiv = document.createElement("div");
      messageDiv.classList.add("message", sender);
      if (isError) messageDiv.classList.add("error");
      messageDiv.textContent = text;
      
      // Inserts the new message *before* the permanent typing indicator element
      chatMessages.insertBefore(messageDiv, typingIndicator);
      
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return messageDiv;
    }

    // --------------------------------------------------
    // 9. NEW: Show/Hide Typing Indicator Functions
    // --------------------------------------------------
    
    function showTypingIndicator() {
      typingIndicator.classList.add("visible");
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTypingIndicator() {
      typingIndicator.classList.remove("visible");
    }

    // --------------------------------------------------

    clearBtn.addEventListener("click", () => {
      conversationHistory = [];
      // Clear all messages *except* the typing indicator
      const allMessages = chatMessages.querySelectorAll(".message:not(.typing)");
      allMessages.forEach(msg => msg.remove());
      appendMessage("Conversation reset! How can I help you?", "bot");
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      conversationHistory.push({ role: "user", content: text });
      userInput.value = "";
      
      // UI Lock
      userInput.disabled = true;
      sendBtn.disabled = true;

      // 10. NEW: Activate Typing dots while waiting
      showTypingIndicator();

      const trimmedHistory = conversationHistory.slice(-MAX_HISTORY_MESSAGES);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ messages: trimmedHistory }),
        });

        // 11. NEW: Hide typing dots immediately after the API responds
        hideTypingIndicator();

        if (!response.ok) {
          throw new Error(`Server status ${response.status}`);
        }

        const data = await response.json();
        const replyText = data.response || "No response received.";
        
        appendMessage(replyText, "bot");
        conversationHistory.push({ role: "assistant", content: replyText });

      } catch (error) {
        console.error("Chat error:", error);
        
        // Ensure indicator hides if an error occurs
        hideTypingIndicator();
        
        conversationHistory.pop();
        appendMessage("Could not connect to the assistant.", "bot", true);
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
