<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website with Embedded Chatbot</title>
  <style>
    /* Reset & Base Demo Page Styling */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #f8f9fa;
      color: #333;
    }

    /* Floating Launcher Button */
    #chat-launcher-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #0d6efd;
      color: #ffffff;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background-color 0.2s ease;
      z-index: 9999;
    }

    #chat-launcher-btn:hover {
      transform: scale(1.05);
      background-color: #0b5ed7;
    }

    /* Embedded Chat Window Box */
    #chat-widget-box {
      display: none; /* Controlled by toggleChat() */
      position: fixed;
      bottom: 96px;
      right: 24px;
      width: 360px;
      height: 520px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      flex-direction: column;
      overflow: hidden;
      z-index: 9999;
      border: 1px solid #e9ecef;
    }

    /* Header Bar */
    .chat-header {
      background: #0d6efd;
      color: #ffffff;
      padding: 16px;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header-close {
      cursor: pointer;
      font-size: 18px;
      opacity: 0.8;
    }

    .chat-header-close:hover {
      opacity: 1;
    }

    /* Message Output Log */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #ffffff;
    }

    .message {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user-msg {
      align-self: flex-end;
      background: #0d6efd;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .bot-msg {
      align-self: flex-start;
      background: #f1f3f5;
      color: #212529;
      border-bottom-left-radius: 2px;
    }

    /* Input Footer Bar */
    .chat-input-area {
      display: flex;
      padding: 12px;
      background: #ffffff;
      border-top: 1px solid #dee2e6;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .chat-input-area input:focus {
      border-color: #0d6efd;
    }

    .chat-input-area button {
      padding: 10px 16px;
      background: #0d6efd;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .chat-input-area button:hover {
      background-color: #0b5ed7;
    }
  </style>
</head>
<body>

  <h1>My Sample Web Page</h1>
  <p>This page demonstrates how the floating chatbot widget interacts with your FastAPI backend.</p>

  <!-- Chatbot Widget HTML Structure -->
  <button id="chat-launcher-btn" onclick="toggleChat()">💬</button>

  <div id="chat-widget-box">
    <div class="chat-header">
      <span>AI Assistant</span>
      <span class="chat-header-close" onclick="toggleChat()">✕</span>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="message bot-msg">Hello! How can I help you today?</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Chatbot Logic Script -->
  <script>
    const BACKEND_URL = "http://127.0.0.1:8000/api/chat";

    // System prompt defining the assistant's behavior
    let chatHistory = [
      { role: "system", content: "You are a polite and helpful assistant embedded on a website." }
    ];

    function toggleChat() {
      const box = document.getElementById("chat-widget-box");
      const isHidden = getComputedStyle(box).display === "none";
      box.style.display = isHidden ? "flex" : "none";
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;

      // 1. Clear input and append user message
      input.value = "";
      appendMessage("user", text);
      chatHistory.push({ role: "user", content: text });

      // 2. Prepare an empty bot message bubble for real-time text streaming
      const botMsgDiv = appendMessage("bot", "");

      try {
        // 3. Send entire chat history to FastAPI endpoint
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: chatHistory })
        });

        if (!response.ok) {
          throw new Error("Failed to reach server");
        }

        // 4. Stream response body using ReadableStream
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullBotResponse = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n\n");

          for (let line of lines) {
            if (line.startsWith("data: ")) {
              const dataStr = line.replace("data: ", "").trim();
              if (dataStr === "[DONE]") break;

              try {
                const parsed = JSON.parse(dataStr);
                fullBotResponse += parsed.content;
                botMsgDiv.textContent = fullBotResponse;
                scrollToBottom();
              } catch (err) {
                // Ignore chunk parse errors
              }
            }
          }
        }

        // 5. Store completed response in message history context
        chatHistory.push({ role: "assistant", content: fullBotResponse });

      } catch (err) {
        botMsgDiv.textContent = "Error: Could not establish connection to backend server.";
      }
    }

    function appendMessage(sender, text) {
      const container = document.getElementById("chat-messages");
      const div = document.createElement("div");
      div.className = `message ${sender === "user" ? "user-msg" : "bot-msg"}`;
      div.textContent = text;
      container.appendChild(div);
      scrollToBottom();
      return div;
    }

    function scrollToBottom() {
      const container = document.getElementById("chat-messages");
      container.scrollTop = container.scrollHeight;
    }
  </script>

</body>
</html>
