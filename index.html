<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot Widget with History</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --chat-bg: #ffffff;
      --text-color: #1e293b;
      --bot-msg-bg: #f1f5f9;
      --user-msg-bg: #2563eb;
      --user-msg-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 600px;
      background: var(--chat-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .chat-header {
      background: var(--primary-color);
      color: white;
      padding: 16px 20px;
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header .header-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    .clear-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .clear-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg-bg);
      color: var(--user-msg-color);
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg-bg);
      color: var(--text-color);
      border-bottom-left-radius: 2px;
    }

    .message.error {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .chat-input-container {
      padding: 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 8px;
      background: #ffffff;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 24px;
      outline: none;
      font-size: 0.95rem;
    }

    .chat-input:focus {
      border-color: var(--primary-color);
    }

    .send-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
    }

    .send-btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div class="header-info">
        <div class="status-dot"></div>
        <span>AI Assistant</span>
      </div>
      <button id="clearBtn" class="clear-btn">Reset</button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        Hello! I'm ready. How can I help you today?
      </div>
    </div>

    <form class="chat-input-container" id="chatForm">
      <input 
        type="text" 
        id="userInput" 
        class="chat-input" 
        placeholder="Type a message..." 
        autocomplete="off"
        required
      >
      <button type="submit" id="sendBtn" class="send-btn">Send</button>
    </form>
  </div>

  <script>
    const API_URL = "https://custom-chatbot-api-yky8.onrender.com/chat";

    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");

    // Array storing ongoing dialogue history
    let conversationHistory = [];

    function appendMessage(text, sender, isError = false) {
      const messageDiv = document.createElement("div");
      messageDiv.classList.add("message", sender);
      if (isError) messageDiv.classList.add("error");
      messageDiv.textContent = text;
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return messageDiv;
    }

    // Reset Chat Memory
    clearBtn.addEventListener("click", () => {
      conversationHistory = [];
      chatMessages.innerHTML = `
        <div class="message bot">
          Conversation reset! How can I help you?
        </div>
      `;
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const text = userInput.value.trim();
      if (!text) return;

      // Render User Message & append to state array
      appendMessage(text, "user");
      conversationHistory.push({ role: "user", content: text });
      userInput.value = "";
      
      userInput.disabled = true;
      sendBtn.disabled = true;

      const loadingDiv = appendMessage("Thinking...", "bot");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ messages: conversationHistory }),
        });

        if (!response.ok) {
          throw new Error(`Server status ${response.status}`);
        }

        const data = await response.json();
        const replyText = data.response || "No response received.";
        
        loadingDiv.textContent = replyText;

        // Save bot response to ongoing history
        conversationHistory.push({ role: "assistant", content: replyText });

      } catch (error) {
        console.error("Chat error:", error);
        loadingDiv.remove();
        // Remove failed user turn from memory
        conversationHistory.pop();
        appendMessage("Could not connect to the assistant.", "bot", true);
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
